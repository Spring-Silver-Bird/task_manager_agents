name: my-check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install deps
        run: make setup

      - name: Build Tailwind CSS
        run: make tailwind-build

      - name: Collect static files
        run: make collectstatic

      - name: Lint (ruff)
        run: make lint

      - name: Tests with coverage
        run: make tests

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contract/package-lock.json

      - name: Install contract deps
        run: npm --prefix contract ci

      - name: Build TypeSpec contract
        run: npm --prefix contract run compile

      - name: Check generated OpenAPI is committed
        run: git diff --exit-code -- contract/tsp-output

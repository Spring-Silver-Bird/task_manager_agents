components:
  schemas:
    DeleteForm:
      type: object
      required:
        - csrfmiddlewaretoken
      properties:
        csrfmiddlewaretoken:
          type: string
      description: Форма подтверждения действия.
    LoginForm:
      type: object
      required:
        - username
        - password
        - csrfmiddlewaretoken
      properties:
        username:
          type: string
        password:
          type: string
        csrfmiddlewaretoken:
          type: string
      description: Форма входа.
    NameForm:
      type: object
      required:
        - name
        - csrfmiddlewaretoken
      properties:
        name:
          type: string
        csrfmiddlewaretoken:
          type: string
      description: Форма метки.
    RegisterForm:
      type: object
      required:
        - first_name
        - last_name
        - username
        - password1
        - password2
        - csrfmiddlewaretoken
      properties:
        first_name:
          type: string
        last_name:

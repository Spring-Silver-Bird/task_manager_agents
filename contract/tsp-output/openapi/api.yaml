security:
  - ApiKeyAuth: []
components:
  parameters:
    CsrfHeader:
      name: X-CSRFToken
      in: header
      required: true
      schema:
        type: string
  schemas:
    LabelRead:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
      description: Метка.
    LabelRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      description: Краткие данные метки.
    LabelWrite:
      type: object
      required:
        - name
      properties:
        name:
          type: string
      description: Создание или изменение метки.
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
      description: Данные для входа.
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      description: Описание ошибки в формате RFC 9457 Problem Details.
    StatusRead:
      type: object
      required:
        - id
        - name
        - when_to_apply
        - status_type
        - created_at
      properties:
        id:
          type: integer

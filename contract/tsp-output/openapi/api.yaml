openapi: 3.1.0
info:
  title: Task Manager API
  version: 1.0.0
tags: []
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      description: Получить CSRF-токен и cookie csrftoken. Доступно без аутентификации.
      parameters: []
      responses:
        '200':
          description: CSRF-токен и cookie csrftoken.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                required:
                  - csrf_token
      security:
        - {}
  /api/v1/auth/login:
    post:
      operationId: login
      description: Вход по username и password. При успехе ставит cookie sessionid.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Успешный вход и cookie sessionid.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
        - {}
  /api/v1/auth/logout:
    post:
      operationId: logout
      description: Выход. Требует session cookie и CSRF-заголовок.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Пустой ответ.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
